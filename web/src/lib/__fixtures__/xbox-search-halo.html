 e incontáveis criações da comunidade da Forja para vivenciar, Halo Infinite é a oferta de multijogador mais expansiva da franquia até o momento. \n\nAproveite uma variedade sem precedentes de experiência de jogo, de modos de jogo intenso e de ritmo rápido para causar caos nos Jogos Personalizados ou até coordenação em cooperação no modo de sobrevivência com base em ondas Tiroteio: Rei da Colina. Com algo para atender às preferências e ao estilo de jogo de cada jogador, é hora de se vestir e montar sua Esquadra! \n\n \n\nBeta da Forja: \n\nA lendária ferramenta de criação de conteúdo de Halo está mais poderosa do que nunca com recursos avançados como um novo motor de script, editor de modos, dimensionamento de objetos, ferramentas de iluminação e áudio, além de melhorias marcadas em fidelidade e limites de orçamento do objeto. \n\nA Forja também inclui o poderoso Kit de Ferramentas de IA, permitindo que os jogadores adicionem uma IA de campanha às suas criações. Seja remasterizando experiências icônicas de versões anteriores de Halo ou criando algo totalmente único, as possibilidades para mapas personalizados e modos de jogo são infinitas. \n\n \n\nJogo de geração cruzada e entre plataformas: \n\nHalo Infinite fornece uma experiência incrível no Xbox One e da nova família de consoles, além de PC com gráficos 4K impressionantes e jogo multiplataforma impressionante. E, no Xbox Series X, assim como PCs com suporte, aproveite recursos melhorados como até 120FPS e tempos de carregamento muito reduzidos, criando um jogo contínuo que traz a próxima geração de jogos. * \n\n*Até 120FPS e 4K Ultra HD disponível no console Xbox Series X e PCs compatíveis apenas em mapas e modos com surpote; TV ou monitor compatíveis requeridos.  ","developerName":"343 Industries","hasAddOns":true,"images":{"boxArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.30769.13727851868390641.270e98c5-0c6a-4ce0-81ab-e78c700bf4b5.092f9454-fee6-43b1-94e3-802dd0067d8b","widt kUri":"https:\u002F\u002Fwww.gov.br\u002Fmj\u002Fpt-br\u002Fassuntos\u002Fseus-direitos\u002Fclassificacao-1","interactiveDescriptions":["Usuários Interagem"],"rating":"16 anos","ratingAge":16,"ratingDescription":"Para maiores de 16 anos"},"description":"VIVA ONDE A LENDA COMEÇA\nHalo: Campaign Evolved é uma recriação fiel e modernizada da campanha de Halo: Combat Evolved. Viva a história original reconstruída com visuais em alta definição, cinemática atualizada e controles aprimorados, além de uma nova aventura de três missões com o Master Chief e o Sgt. Johnson. Um arsenal ampliado de armas, veículos, inimigos e “Skulls”, modificadores opcionais que transformam o combate de maneiras divertidas e desafiadoras, agregando novas táticas e rejogabilidade infinita. \n\nJogue do seu jeito: sozinho, no modo cooperativo de tela dividida para 2 jogadores (somente console) ou no modo cooperativo online para até 4 jogadores com suporte total para jogo cruzado e progressão cruzada.* Não importa se você está descobrindo Halo pela primeira vez ou retornando depois de 25 anos, Halo: Campaign Evolved oferece uma aventura que é ao mesmo tempo atemporal e totalmente nova.\n\nDESCUBRA O RINGWORLD: \nApós um pouso forçado em um misterioso mundo circular conhecido como Halo, o Master Chief recebe a tarefa de ajudar os humanos restantes a sobreviverem contra as forças esmagadoras do Covenant. Com a ajuda de Cortana, sua companheira de IA, ele explora os segredos de Halo e luta para salvar a galáxia da completa aniquilação.\n\nA CAMPANHA COMPLETA, RECONSTRUÍDA: \nLute nas missões originais, refeitas com visuais de alta definição, cinemática atualizada e design de níveis refinado.\n\nCINEMÁTICA E ÁUDIO REFORMULADOS: \nVisuais e animações totalmente novos, além de uma trilha sonora remasterizada e design de som totalmente reconstruído para uma imersão mais profunda.\n\nCOMBATE E ARMAS EXPANDIDOS: \nO combate clássico de Halo está mais ágil do que nunca, agora com 9 armas icônicas adicionais de toda a série para incrementar seu arsenal.\n\nTRÊS NOVAS MISSÕES: \nJogue como Master Chief ao lado do Sgt. Johnson em Operation: Meteorite, uma operação de combate independente com novos ambientes, gameplay e inimigos.\n\nJOGUE SOZINHO OU COM AMIGOS: \nModo cooperativo para 2 jogadores em tela dividida (apenas no console) ou cooperativo online para 4 jogadores, com suporte a jogo cruzado e progressão cruzada entre console e PC.\n\nDIRIJA, SEQUESTRE, CAUSE ESTRAGOS: \nOs veículos icônicos de Halo estão de volta, oferecendo ainda mais formas de provocar caos memorável. Pela primeira vez em Halo: CE, você pode sequestrar veículos inimigos e pilotar um tanque Wraith totalmente funcional.\n\nREJOGABILIDADE INFINITA: \nRemixe cada missão com os modificadores opcionais “Skull”, que adicionam variedade e desafio com armas, inimigos e ambientes aleatórios.","developerName":"Halo Studios","hasAddOns":true,"images":{"boxArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.60927.14013303168404443.9aeddd2c-3066-401b-a64b-fbe89019f14a.73bd7844-734e-4e22-8d96-03b942b3566d","width":2160,"height":2160,"backgroundColor":"#FFFFFF"},"poster":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.33604.14013303168404443.9aeddd2c-3066-401b-a64b-fbe89019f14a.d9903df6-1139-45ca-9be8-af50a3290e51","width":1440,"height":2160,"backgroundColor":"#FFFFFF"},"superHeroArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.55711.14013303168404443.9aeddd2c-3066-401b-a64b-fbe89019f14a.7d3e0d82-8972-47d4-956b-79be525dcb3c","width":3840,"height":2160,"backgroundColor":"#FFFFFF"},"featurePromotionalSquareArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.11755.14013303168404443.9aeddd2c-3066-401b-a64b-fbe89019f14a.436bd682-3488-45f8-ad3f-cb7549c41a65","width":1080,"height":1080,"backgroundColor":"#FFFFFF"}},"includedWithPassesProductIds":["CFQ7TTC0K6L8","CFQ7TTC0KGQ8"],"isStreamingOnlyConsumab }},"xCloudPropertiesV2":{"xCloudId":"HALOCAMPAIGNEVOLVED","xboxTitleId":2082978535,"programs":["CALLISTO","DIA","EUROPA","TRITON"],"supportedInputTypes":["Controller","MKB"],"supportsTouch":false},"isAvailableOnGarrison":true,"hasUbisoftCrossEntitlementProduct":false},"9N683TDT5M7R":{"availableOn":["PC","XboxSeriesX","XCloud","Handheld"],"averageRating":3.5,"badges":[{"type":3},{"type":2}],"categories":["Ação e aventura","Jogos de tiros"],"contentRating":{"boardName":"DJCTQ","description":"Para maiores de 16 anos","disclaimers":[],"descriptors":["Violência"],"imageUri":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fglobal.14869.image.ab5c1e6b-1a12-41c8-8892-68fb5485651b.5db2e90e-31d8-4a93-932f-25232214f55c","imageLinkUri":"https:\u002F\u002Fwww.gov.br\u002Fmj\u002Fpt-br\u002Fassuntos\u002Fseus-direitos\u002Fclassificacao-1","interactiveDescriptions":["Usuários Interagem"],"rating":"16 anos","ratingAge":16,"ratingDescription":"Para maiores de 16 anos"},"description":"Vivencie o início da lenda\n\nHalo: Campaign Evolved é um remake fiel, porém modernizado, da campanha Halo: Combat Evolved. Vivencie a história original reconstruída com visuais de alta definição, cinemáticas atualizadas e controles refinados, além de três novas missões prequela com o Master Chief e o Sgt. Johnson. Um arsenal ampliado de armas, veículos, inimigos e “Skulls” que modificam a jogabilidade (modificadores opcionais que deixam o combate mais divertido e desafiador) e adicionam novas táticas e infinita rejogabilidade. \n\nJogue do seu jeito: sozinho, em modo co-op com tela dividida para 2 jogadores (somente console) ou em modo cop-op online para até 4 jogadores com suporte completo para crossplay e progressão cruzada.  Não importa se você está descobrindo Halo pela primeira vez ou voltando ao combate depois de 25 anos, Halo: Campaign Evolved oferece uma aventura lendária, atemporal e totalmente renovada.\n\nDescubra o Ringworld\n\nApós um pouso forçado em um misterioso mundo circular conhecido como Halo, o Master Chief recebe a tarefa de ajudar os humanos restantes a sobreviverem contra as forças esmagadoras do Covenant. Com a ajuda de Cortana, sua companheira de IA, ele explora os segredos de Halo e luta para salvar a galáxia da completa aniquilação.\n\nPrincipais recursos\n\nA campanha completa, reconstruída\nLute nas missões originais, recentemente reconstruídas com design avançado, cinemática atualizada e sinalização aprimorada, refinadas para manter o ritmo sem perder o encanto, a tensão ou o heroísmo do original.\n\nCinemática e áudio avançados\nVistas icônicas, arquitetura alienígena e encantos da ficção científica renascem com novos visuais, cinemática e animações. A trilha sonora foi remasterizada, o design de som foi atualizado para proporcionar maior imersão e novas performances de voz foram gravadas com o elenco principal.\n\nCombate e armas expandidos\nO combate clássico de Halo parece instantaneamente familiar, mas mais afiado do que nunca. Corra, mire e ataque com excelente precisão. Pela primeira vez em Halo: CE, você pode empunhar 9 armas icônicas adicionais de toda a série, incluindo a Espada de Energia, o Rifle de Batalha e o Rifle de Agulha, oferecendo mais maneiras de abordar cada luta.\n\nTrês novas missões prequela\nJunte-se ao Master Chief e ao Sgt. Johnson em um novo arco ambientado antes dos eventos de Halo: Combat Evolved, com novos ambientes, jogabilidade, personagens e inimigos.\n\nJogue sozinho ou com amigos\nJogue a campanha completa no modo co-op em tela dividida para 2 jogadores (somente console) ou no modo co-op online para 4 jogadores, completo com crossplay e progressão compartilhada entre console e PC.\n\nDirija, sequestre, cause estragos\nNão importa se você está percorrendo o mapa em um Warthog ou capotando-o com amigos, os veículos sempre estiveram no coração da diversão em Halo. Agora, eles vão ainda mais longe: pela primeira vez em Halo: CE, você pode sequestrar veículos inimigos e pilotar um Wraith totalmente dirigível, criando um caos inesquecível.\n\nReinvente sua campanha para uma jogabilidade infinita\nUse o recurso de remix de campanha para retornar a qualquer missão e reinventar a experiência com os \"\"Skulls\"\", os modificadores de jogabilidade mais ousados já vistos em uma campanha de Halo. Esses modificadores opcionais adicionam desafio e variedade com armas, inimigos e ambientes aleatórios.","developerName":"Halo Studios","hasAddOns":true,"hhVerified":{"deviceEvaluation":1},"images":{"boxArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.60927.14018605831064250.443dafeb-7b4f-43fb-9452-0232c2810ba0.6c4e60ff-cf46-4b2e-8d42-13bd469e6840","width":2160,"height":2160},"poster":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.33604.14018605831064250.443dafeb-7b4f-43fb-9452-0232c2810ba0.ca64edbb-f443-42b5-8863-346fe5e0eb60","width":1440,"height":2160},"superHeroArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.55711.14018605831064250.443dafeb-7b4f-43fb-9452-0232c2810ba0.98c3c64e-96ea-4ac7-bbd5-8f6227ee33ea","width":3840,"height":2160},"featurePromotionalSquareArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.11755.14018605831064250.443dafeb-7b4f-43fb-9452-0232c2810ba0.40f9e545-edb8-47c9-b767-13b07fa951e9","width":1080,"height":1080}},"includedWithPassesProductIds":["CFQ7TTC0K6L8","CFQ7TTC0KGQ8"],"isStreamingOnlyConsumable":false,"maxInstallSize":0,"optimalSatisfyingPassId":"CFQ7TTC0K6L8","preferredSkuId":"0010","productFamily":"Games","productId":"9N683TDT5M7R","productKind":"Game","publisherName":"Xbox Game Studio","ratingCount":294,"shortDescription":"Halo: Campaign Evolved é um remake fiel, porém modernizado, da campanha Halo: Combat Evolved, reconstruída do zero – e agora com visuais em HD, controles refinados, modo co-op online para até 4 jogadores, 3 novas missões e um arsenal expandido de armas, veículos e novos inimigos. ","show 6e1b9188e2.78432158-0281-4e1a-b37f-dee253f27111","imageLinkUri":"https:\u002F\u002Fwww.gov.br\u002Fmj\u002Fpt-br\u002Fassuntos\u002Fseus-direitos\u002Fclassificacao-1","interactiveDescriptions":[],"rating":"14 anos","ratingAge":14,"ratingDescription":"Para maiores de 14 anos"},"description":"Multijogador gratuito: \n\nVivencie o célebre multijogador do Halo reimaginado e gratuito! Com mais de 70 mapas em organização de partida, bilhões de configurações de personalização e incontáveis criações da comunidade da Forja para vivenciar, Halo Infinite é a oferta de multijogador mais expansiva da franquia até o momento. \n\nAproveite uma variedade sem precedentes de experiência de jogo, de modos de jogo intenso e de ritmo rápido para causar caos nos Jogos Personalizados ou até coordenação em cooperação no modo de sobrevivência com base em ondas Tiroteio: Rei da Colina. Com algo para atender às preferências e ao estilo de jogo de cada jogador, é hora de se vestir e montar sua Esquadra! \n\n \n\nBeta da Forja: \n\nA lendária ferramenta de criação de conteúdo de Halo está mais poderosa do que nunca com recursos avançados como um novo motor de script, editor de modos, dimensionamento de objetos, ferramentas de iluminação e áudio, além de melhorias marcadas em fidelidade e limites de orçamento do objeto. \n\nA Forja também inclui o poderoso Kit de Ferramentas de IA, permitindo que os jogadores adicionem uma IA de campanha às suas criações. Seja remasterizando experiências icônicas de versões anteriores de Halo ou criando algo totalmente único, as possibilidades para mapas personalizados e modos de jogo são infinitas. \n\n \n\nJogo de geração cruzada e entre plataformas: \n\nHalo Infinite fornece uma experiência incrível no Xbox One e da nova família de consoles, além de PC com gráficos 4K impressionantes e jogo multiplataforma impressionante. E, no Xbox Series X, assim como PCs com suporte, aproveite recursos melhorados como até 120FPS e tempos de carregamento muito reduzidos, criando um jogo contínuo que traz a próxima geração de jogos. * \n\n*Até 120FPS e 4K Ultra HD disponível no console Xbox Series X e PCs compatíveis apenas em mapas e modos com surpote; TV ou monitor compatíveis requeridos.  ","developerName":"343 Industries","hasAddOns":true,"hhVerified":{"deviceEvaluation":3},"images":{"boxArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.54714.14330850369313893.a687698c-b891-44f6-9576-fe28978ce915.27742122-f062-410c-84f4-0fcf7b89524e","width":1080,"height":1080},"poster":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.3823.14330850369313893.a687698c-b891-44f6-9576-fe28978ce915.5aada4fa-d850-4eb5-9100-33a81a5cde09","width":1440,"height":2160},"superHeroArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.47030.14330850369313893.a687698c-b891-44f6-9576-fe28978ce915.ce613c75-aac4-4721-9941-6a254d061488","width":3840,"height":2160},"featurePromotionalSquareArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.31815.14330850369313893.a687698c-b891-44f6-9576-fe28978ce915.4af92722-204c-4a75-be62-1701d33b5c13","width":1080,"height":1080}},"includedWithPassesProductIds":["CFQ7TTC0K6L8","CFQ7TTC0KGQ8","CFQ7TTC0P85B"],"isStreamingOnlyConsumable":false,"maxInstallSize":0,"optimalSkuId":"0010","preferredSkuId":"0010","productFamily":"Games","productId":"9PP5G1F0C2B6","productKind":"Game","publisherName":"Xbox Game Studios","ratingCount":1742,"releaseDate":"2021-11-15T18:00:00.0000000Z","shortDescription":"De uma das sagas mais icônicas dos jogos, Halo está maior do que nunca com uma experiência multijogador dinâmica e gratuita.  ","showSupportedLanguageDisclaimer":false,"specificPrices":{"purchaseable":[{"skuId":"0010","availabilityId":"9XFR1LB3NKTZ","discountPercentage":0,"eligibilityInfo":{"eligibility":"None","type":"Unknown"},"availabilityActions":["Details","Fulfill","Purchase","Browse","Curate","Redeem"],"endDateUtc":"08\u002F s multijogador (incluindo os mapas originais de Halo Combat Evolved), mapas Spartan Ops e inúmeras maneiras de jogar os conteúdos criados pela comunidade com a Forge. Agora atualizada com aprimoramentos para o Xbox Series X, esta é a coletânea dos sonhos de todo fã de Halo!* \r\n\r\n*Aviso Geral de Isenção de Responsabilidade – Melhorias no modo com tela dividida e resolução de 4K a 120FPS só estão disponíveis no Xbox Series X. No Xbox Series S está disponível a resolução de 1080p a 120FPS. Alguns recursos de jogo, incluindo os vídeos secretos de terminais, requerem conexão à Internet de banda larga; sujeita às taxas do provedor de acesso. Recursos do multijogador online requerem uma assinatura Game Pass Core (vendida separadamente). ","developerName":"343 Industries","hasAddOns":true,"images":{"boxArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.16930.13817186670444302.148c432a-9fce-4c7d-bf13-8a2bd3a527b3.99d16324-9915-41d7-a388-fa5dd98940cb","width":2160,"height":2160,"backgroundColor":"#FFFFFF"},"poster":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.13367.14415742612829493.1297136a-f273-41f1-947f-59044c848c55.5b67a38e-b742-4dce-a884-4e2878d50c54","width":1440,"height":2160,"backgroundColor":"#FFFFFF"},"superHeroArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.36764.14415742612829493.1297136a-f273-41f1-947f-59044c848c55.4c14355f-10d9-4fb3-ae20-3ff785cee057","width":3840,"height":2160,"backgroundColor":"#FFFFFF"},"featurePromotionalSquareArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.25684.14415742612829493.1297136a-f273-41f1-947f-59044c848c55.a214b624-1143-4a73-9976-a7e393a18b48","width":1080,"height":1080,"backgroundColor":"#FFFFFF"}},"includedWithPassesProductIds":["CFQ7TTC0K6L8","CFQ7TTC0P85B"],"isStreamingOnlyConsumable":false,"maxInstallSize":0,"optimalSkuId":"0010","preferredSkuId":"0010","productFamily":"Games","productId":"9MT8PTG eOnGarrison":false,"hasUbisoftCrossEntitlementProduct":false},"BRRC2BP0G9P0":{"availableOn":["XboxOne","XboxSeriesX","XCloud"],"averageRating":4.5,"badges":[{"type":8},{"type":3},{"type":9}],"categories":["Jogos de tiros"],"contentRating":{"boardName":"DJCTQ","description":"Para maiores de 14 anos","disclaimers":[],"descriptors":["Violência"],"imageUri":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fglobal.46468.image.07d1b7e0-af45-474d-8242-d86e1b9188e2.78432158-0281-4e1a-b37f-dee253f27111","imageLinkUri":"https:\u002F\u002Fwww.gov.br\u002Fmj\u002Fpt-br\u002Fassuntos\u002Fseus-direitos\u002Fclassificacao-1","interactiveDescriptions":[],"rating":"14 anos","ratingAge":14,"ratingDescription":"Para maiores de 14 anos"},"description":"Halo 5: Guardians oferece uma experiência multijogador épica com vários modos, ferramentas completas para criação de níveis e um novo capítulo da saga do Master Chief. Agora, com Xbox One X, os jogadores podem aproveitar visuais aprimorados e mais detalhados, com resolução de até 4K  e fidelidade gráfica melhorada, deixando o jogo mais bonito do que nunca, mantendo consistência com 60 FPS para jogar da forma mais fluida possível.\r\n\r\nCAMPANHA ÉPICA\r\nA saga do Master Chief continua em uma experiência individual ou cooperativa para 4 jogadores em três mundos. Uma força misteriosa e implacável ameaça a galáxia. Os Spartans da Esquadra Osiris e a Equipe Azul devem embarcar em uma jornada que vai mudar o rumo da história e o futuro da humanidade.\r\n\r\nMULTIJOGADOR ZONA DE GUERRA\r\nJogue com amigos ou enfrente rivais em três grandes modos multijogador inéditos, na franquia Halo: Zona de Guerra, Ataque Zona de Guerra e Tiroteio Zona de Guerra. \r\n\r\n- ZONA DE GUERRA é um modo multijogador de grande escala que suporta batalhas de 24 jogadores, com inimigos controlados por IA aparecendo constantemente para dar uma agitada na experiência. \r\n\r\n- No ATAQUE ZONA DE GUERRA, temos um \"ataque e defesa\" de 24 jogadores em que a equipe atacante tem que invadir pontos estratégicos, enquanto a equipe oposta trabalha para impedir a ofensiva. \r\n\r\n- TIROTEIO ZONA DE GUERRA é uma nova e ambiciosa experiência multijogador, que entrega a maior experiência cooperativa já vista na história da franquia Halo. Até oito jogadores trabalham juntos para concluir cinco rodadas de objetivos dinâmicos, com tempo determinado, que ficam cada vez mais difíceis, para saírem vitoriosos.\r\n\r\nARENA MULTIJOGADOR\r\nA Arena multijogador do Halo 5 mantém o legado consolidado de puro combate competitivo 4v4 baseado em habilidade. Vários modos de Arena oferecem incontáveis formas de jogar e competir, dos clássicos modos Assassino e Capture a Bandeira a modos sociais populares, como Infecção, Bola Veloz e o novo Super Fiesta.\r\n\r\nFORGE\r\nPor anos, o modo Forge permitiu que os fãs de Halo criassem novos mapas e modos de jogo que mudam a experiência e a forma de jogar Halo. Baixe novos níveis criados pela comunidade de Forge, tanto no Windows (usando o “Halo 5: Forge” para Windows 10) quando no Xbox One. Personalize mapas existentes ou crie o seu próprio do zero. Procure, encontre e jogue uma série interminável de jogos personalizados criados e hospedados pela comunidade.\r\n\r\nSISTEMA REQ\r\nNovo no Halo 5: Guardians é o Sistema de Requisição (Sistema REQ), que premia os jogadores por seu tempo gasto nos modos multijogador de Halo 5. Os jogadores receberão Pontos REQ após cada partida na Arena ou na Zona de Guerra, que podem então ser usados para comprar Pacotes REQ contendo uma variedade de itens REQ – armas, armaduras, veículos, posturas, assassinatos e mais – para serem desbloqueados!\r\n\r\nADVERTÊNCIA DE FOTOSSENSIBILIDADE: Uma pequena parcela da população pode apresentar ataques epiléticos ou convulsões quando exposta a certas imagens, incluindo os flashes das luzes ou padrões que aparecem nos videogames. Visite Xbox.com para mais informações","developerName":"343 Industries","hasAddOns":true,"images ePricesCount":0},"title":"Halo Wars","videos":[],"cmsVideos":[],"passMetadataByPassProductId":{},"isAvailableOnGarrison":false,"hasUbisoftCrossEntitlementProduct":false},"9PNGDJM7FKZH":{"availableOn":["XboxSeriesX","PC"],"averageRating":3.5,"badges":[],"categories":["Jogos de tiros"],"contentRating":{"boardName":"DJCTQ","description":"Para maiores de 16 anos","disclaimers":[],"descriptors":["Violência"],"imageUri":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fglobal.14869.image.ab5c1e6b-1a12-41c8-8892-68fb5485651b.5db2e90e-31d8-4a93-932f-25232214f55c","imageLinkUri":"https:\u002F\u002Fwww.gov.br\u002Fmj\u002Fpt-br\u002Fassuntos\u002Fseus-direitos\u002Fclassificacao-1","interactiveDescriptions":["Usuários Interagem"],"rating":"16 anos","ratingAge":16,"ratingDescription":"Para maiores de 16 anos"},"description":"PREMIUM EDITION INCLUI:\n•\tJogo Halo: Campaign Evolved\n•\tAlpha Halo Armory Pack, com 5 skins de armadura Master Chief e 6 skins de armas\n•\tLivro de arte digital Art of Halo: Campaign Evolved\n•\tConto digital Halo: Hungry Buzzards\n•\tManual do jogo digital\n\nVIVA ONDE A LENDA COMEÇA\nHalo: Campaign Evolved é uma recriação fiel e modernizada da campanha de Halo: Combat Evolved. Viva a história original reconstruída com visuais em alta definição, cinemática atualizada e controles aprimorados, além de uma nova aventura de três missões com o Master Chief e o Sgt. Johnson. Um arsenal ampliado de armas, veículos, inimigos e “Skulls”, modificadores opcionais que transformam o combate de maneiras divertidas e desafiadoras, agregando novas táticas e rejogabilidade infinita. \n\nJogue do seu jeito: sozinho, no modo cooperativo de tela dividida para 2 jogadores (somente console) ou no modo cooperativo online para até 4 jogadores com suporte total para jogo cruzado e progressão cruzada.* Não importa se você está descobrindo Halo pela primeira vez ou retornando depois de 25 anos, Halo: Campaign Evolved oferece uma aventura que é ao mesmo tempo atem e vista do Comandante. Halo Wars 2 é um jogo de estratégia em tempo real com gráficos em Ultra HD 4K com HDR no Xbox One X e Windows 10. Halo Wars 2 também suporta Xbox Play Anywhere: compre só uma vez e jogue no Xbox e Windows 10.\r\n\r\nUma história totalmente nova e cheia de ação – os heróis de Halo Wars despertam e encontram a galáxia em grande perigo. Depois dos eventos de Halo 5, viva uma nova história com missões cheias de ação em um lugar lendário conhecido como Ark. Os jogadores comandam um enorme poder de fogo, enfrentando uma ameaça terrível contra o UNSC e toda a humanidade em grandes batalhas. \r\n\r\nMonte seu Exército em Halo – construa suas bases, prepare seus veículos e reúna tropas. Lidere-o em imensas batalhas com partidas de campanha contra IA, ou colaborando e enfrentando seus amigos em partidas 3v3 no Xbox Live. Aprenda novas estratégias com diferentes líderes nos modos de jogo Blitz e Multijogador. \r\n\r\nCom Halo Wars 2, você pode explorar e batalhar no universo de Halo de maneira inédita. \r\n\r\nOs recursos multijogador on-line requerem a Assinatura Game Pass Core (vendida separadamente). \r\n\r\nADVERTÊNCIA DE FOTOSSENSIBILIDADE: Uma pequena parcela da população pode apresentar ataques epiléticos ou convulsões quando exposta a certas imagens, incluindo os flashes das luzes ou padrões que aparecem nos videogames. Acesse Xbox.com para mais informações.","developerName":"343 Industries \u002F Creative Assembly","hasAddOns":true,"hhVerified":{"deviceEvaluation":3},"images":{"boxArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.6988.13510798886375954.7fab3417-408f-452b-bb10-612182e7a5ee.5708d7dd-59ab-411a-b732-5de746c6ee4c","width":2160,"height":2160},"poster":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.53461.13510798886375954.2bd17aeb-ccc6-4036-989d-32d2eba17cb4.5d2d8045-b64c-414b-be60-78bc5c7e85f2","width":1440,"height":2160},"superHeroArt":{"url":"https:\u002F\u002Fstore-images. ee253f27111","imageLinkUri":"https:\u002F\u002Fwww.gov.br\u002Fmj\u002Fpt-br\u002Fassuntos\u002Fseus-direitos\u002Fclassificacao-1","interactiveDescriptions":[],"rating":"14 anos","ratingAge":14,"ratingDescription":"Para maiores de 14 anos"},"description":"MEMBROS DO XBOX GAME PASS – Baixem e joguem selecionando \"Halo: The Master Chief Collection\", \"Halo 3: ODST\" e \"Halo: Reach\" em \"Neste Pacote\". \r\n\r\nA Temporada 6 já está disponível com a atualização GRATUITA mais recente para Halo: The Master Chief Collection! Divirta-se com novos conteúdos:\r\n•\tNovas armaduras de Halo 3 inspiradas no jogo de fliperama Halo: Fireteam Raven. Os jogadores podem desbloquear quatro conjuntos de armaduras e capas para veículos e armas com a temática dessa equipe de ataque lendária.\r\n•\tNovas opções de personalização: crie um Spartan especialmente para você, com novos efeitos visuais, visores animados, acessórios traseiros para Halo 3 e mais de 100 prêmios da Temporada 6.\r\n•\tTroca de Pontos da Temporada: troque pontos da temporada por itens de personalização visual exclusivos e prêmios de desafios de temporadas anteriores.\r\n\r\nAprimorada, atualizada e melhor do que nunca, agora a história completa do Master Chief está otimizada para o Xbox Series X|S. Aproveite recursos de próxima geração como carregamento rápido, cross-play multigeração, ajuste do campo de visão, experiência com tela dividida aprimorada e resolução de até 4K a 120 FPS.*\r\nHomenageando o herói icônico e sua jornada épica, a coletânea Halo: The Master Chief Collection reúne a história completa do Master Chief. Halo: Combat Evolved Anniversary, Halo 2: Anniversary, Halo 3, Halo 4, e agora Halo: Reach e Halo 3: ODST foram incluídos e integrados em uma experiência única. \r\n\r\nO Pacote Digital da Master Chief Collection é a maior experiência de Halo já lançada, com um total de 67 missões de campanha, mais de 120 mapas multijogador (incluindo os mapas originais de Halo Combat Evolved), mapas de Spartan Ops e inúmeras maneiras de jogar os conteúdos criados pela comunidade com a Forge. Agora atualizada com aprimoramentos para o Xbox Series X, essa é a coletânea dos sonhos de todo fã de Halo!* \r\n\r\n*Aviso a Todos – Melhorias no modo com tela dividida e resolução de 4K a 120 FPS só estão disponíveis no Xbox Series X. No Xbox Series S está disponível a resolução de 1080p a 120 FPS. Alguns recursos do jogo, incluindo os vídeos secretos de terminais, requerem uma conexão de internet banda larga, sujeita às taxas cobradas pelo provedor. Os recursos de multijogador online requerem uma assinatura Xbox Live Gold (vendida separadamente). \r\n\r\n\r\nA História Completa de Master Chief – Honrando o herói icônico e sua jornada épica, a história completa de Master Chief está reunida em Halo: The Master Chief Collection. Halo: Combat Evolved Anniversary, Halo 2: Anniversary, Halo 3 e Halo 4 estão todos incluídos e, juntos, totalizam 45 missões de campanha, mais de 100 mapas multijogador (incluindo os mapas originais de Halo Combat Evolved) e mapas de Spartan Ops. Agora atualizada com melhorias do Xbox One X para fornecer suporte a resoluções de até 4K UHD e HDR, essa é a coletânea dos sonhos de todo fã de Halo!*\r\n\r\n\r\n\r\nHalo 2: Anniversary – Em celebração ao aniversário de 10 anos de Halo 2, o favorito dos fãs retorna apresentando uma campanha totalmente remasterizada com o \"Modo Clássico\", que permite a você alternar entre o jogo remasterizado e o original de 2004. Descubra novos elementos da história de Halo 5: Guardians com cenas estendidas, vídeos secretos de terminais, e utilize crânios inéditos para vivenciar a campanha de uma maneira completamente nova. Incluindo os 25 mapas multijogador originais, do jeitinho que os fãs se lembram, além de 6 mapas completamente reformulados. Curta o jogo que definiu o modo multijogador online nos consoles e prepare-se para o próximo capítulo da série Halo.\r\n\r\n\r\n\r\nNova Atualização – As modificações recentes trouxeram novos recursos, como suporte a LAN local offline, download inteligente de conteúdos específicos, carregamento rápido e melhorias do Xbox One X, como o suporte* a resoluções de até 4K UHD e HDR, assim como otimizações e aperfeiçoamentos ao organizar partida. Halo: The Master Chief Collection continua sendo o lugar definitivo para vivenciar a origem da saga de Master Chief.\r\n\r\n\r\n\r\n*Aviso a Todos – É necessário um Xbox One X para obter suporte à resolução 4K UHD e HDR. Alguns recursos do jogo, incluindo os vídeos secretos de terminais, requerem uma conexão de internet banda larga, sujeita às taxas cobradas pelo provedor. Os recursos de multijogador online requerem uma assinatura Xbox Live Gold (vendida separadamente). Halo: Nightfall, a série live action de 5 episódios, só pode ser assistida por streaming. Requer um Xbox One ou Windows 8.1 ou superior e uma conexão de internet banda larga, sujeita às taxas cobradas pelo provedor. Apenas para maiores de 17 anos. As datas, o conteúdo e os recursos de Halo: Nightfall estão sujeitos a mudanças. Acesse www.xbox.com\u002Fhalo","developerName":"343 Industries","hasAddOns":true,"images":{"boxArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.39962.14415742612829493.9171a818-3c53-4dc7-a187-714bc0d9631d.8ada5595-cc0a-4d72-9999-103082312e1d","width":1080,"height":1080},"poster":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.13367.14415742612829493.1297136a-f273-41f1-947f-59044c848c55.5b67a38e-b742-4dce-a884-4e2878d50c54","width":1440,"height":2160},"superHeroArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.36764.14415742612829493.1297136a-f273-41f1-947f-59044c848c55.4c14355f-10d9-4fb3-ae20-3ff785cee057","width":3840,"height":2160},"featurePromotionalSquareArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.25684.14415742612829493.1297136a-f273-41f1-947f-59044c848c55.a214b624-1143-4a73-9976-a7e393a18b48" ign missions. Each leader includes a variety of new units and powerful leader abilities and will change the way you strategize on the battlefield. \r\n\r\nThe Complete Edition also includes Halo Wars 2: Awakening the Nightmare, the new expansion that allows you to play as Atriox’s Banished forces in a fight against the awakened Flood. You’ll get two new Banished leaders as well as the new co-op tower defense mode Terminus Firefight. In Terminus Firefight, play with up to two other players and defend your base against endless waves of enemy forces. \r\n\r\n*Online multiplayer on Xbox console requires Game Pass Core membership (sold separately)\r\n\r\nIncludes: \r\n• Halo Wars 2 – 12 campaign missions playable solo or co-op online, 6 multiplayer leaders across the UNSC and Banished forces, a variety of traditional multiplayer modes, plus Blitz PVP and PVE\r\n• Halo Wars 2: Season Pass –7 additional multiplayer leaders and 2 campaign missions\r\n• Awakening the Nightmare – 5 campaign missions, 2 new multiplayer leaders, and an all new tower-defense co-op mode – Terminus Firefight","developerName":"343 Industries \u002F Creative Assembly","hasAddOns":true,"images":{"boxArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.46821.14307168999728048.1152921504738970858.d4f2c0a6-7d8b-4924-a973-4b6991eab64b","width":2160,"height":2160,"backgroundColor":"#FFFFFF"},"poster":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.46259.14307168999728048.1152921504738970865.cdcda9f5-265b-4045-89f1-d8790a39ce4b","width":1440,"height":2160,"backgroundColor":"#FFFFFF"},"superHeroArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.36766.14307168999728048.1152921504737154776.36507049-e62d-4d65-8bbb-18ce77c454d1","width":1920,"height":1080,"backgroundColor":"#FFFFFF"}},"includedWithPassesProductIds":[],"isStreamingOnlyConsumable":false,"maxInstallSize":0,"optimalSkuId":"0010","preferredSkuId":"0010","productFam ém suporta Xbox Play Anywhere: compre só uma vez e jogue no Xbox e Windows 10.\r\n\r\nUma história totalmente nova e cheia de ação – os heróis de Halo Wars despertam e encontram a galáxia em grande perigo. Depois dos eventos de Halo 5, viva uma nova história com missões cheias de ação em um lugar lendário conhecido como Ark. Os jogadores comandam um enorme poder de fogo, enfrentando uma ameaça terrível contra o UNSC e toda a humanidade em grandes batalhas. \r\n\r\nMonte seu Exército em Halo – construa suas bases, prepare seus veículos e reúna tropas. Lidere-o em imensas batalhas com partidas de campanha contra IA, ou colaborando e enfrentando seus amigos em partidas 3v3 no Xbox Live. Aprenda novas estratégias com diferentes líderes nos modos de jogo Blitz e Multijogador. \r\n\r\nCom Halo Wars 2, você pode explorar e batalhar no universo de Halo de maneira inédita. \r\n\r\nOs recursos multijogador on-line requerem a Assinatura Xbox Live Gold (vendida separadamente). \r\n\r\nADVERTÊNCIA DE FOTOSSENSIBILIDADE: Uma pequena parcela da população pode apresentar ataques epiléticos ou convulsões quando exposta a certas imagens, incluindo os flashes das luzes ou padrões que aparecem nos videogames. Acesse Xbox.com para mais informações.","developerName":"343 Industries \u002F Creative Assembly","hasAddOns":true,"images":{"boxArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.6988.66922732424733865.effc282c-0a95-45c2-8069-86e7e083b3aa.d9a002b9-654e-406f-bce9-4d9de652143a","width":2160,"height":2160,"backgroundColor":"#FFFFFF"},"poster":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.53461.66922732424733865.effc282c-0a95-45c2-8069-86e7e083b3aa.a6e0c6a7-34c8-410b-871a-b1e6d650871a","width":1440,"height":2160,"backgroundColor":"#FFFFFF"},"superHeroArt":{"url":"https:\u002F\u002Fstore-images.s-microsoft.com\u002Fimage\u002Fapps.25463.66922732424733865.effc282c-0a95-45c2-8069-86e7e083b3aa.13ca4a16-2390-4552-ac35-49ef77416cb modos, dimensionamento de objetos, ferramentas de iluminação e áudio, além de melhorias marcadas em fidelidade e limites de orçamento do objeto. \n\nA Forja também inclui o poderoso Kit de Ferramentas de IA, permitindo que os jogadores adicionem uma IA de campanha às suas criações. Seja remasterizando experiências icônicas de versões anteriores de Halo ou criando algo totalmente único, as possibilidades para mapas personalizados e modos de jogo são infinitas. \n\n \n\nJogo de geração cruzada e entre plataformas: \n\nHalo Infinite fornece uma experiência incrível no Xbox One e da nova família de consoles, além de PC com gráficos 4K impressionantes e jogo multiplataforma impressionante. E, no Xbox Series X, assim como PCs com suporte, aproveite recursos melhorados como até 120FPS e tempos de carregamento muito reduzidos, criando um jogo contínuo que traz a próxima geração de jogos. * \n\n*Até 120FPS e 4K Ultra HD disponível no console Xbox Series X e PCs compatíveis apenas em mapas e modos com surpote; TV ou monitor compatíveis requeridos.  ","skuId":"0010","skuImages":{},"skuTitle":"Halo Infinite","isUbisoftConsoleCrossEntitlement":false}},"9N6J4RNFPKKL":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"9PR4ZZ41MGCD","preferredAvailabilityId":"9PR4ZZ41MGCD","productId":"9N6J4RNFPKKL","skuDescription":"VIVA ONDE A LENDA COMEÇA\nHalo: Campaign Evolved é uma recriação fiel e modernizada da campanha de Halo: Combat Evolved. Viva a história original reconstruída com visuais em alta definição, cinemática atualizada e controles aprimorados, além de uma nova aventura de três missões com o Master Chief e o Sgt. Johnson. Um arsenal ampliado de armas, veículos, inimigos e “Skulls”, modificadores opcionais que transformam o combate de maneiras divertidas e desafiadoras, agregando novas táticas e rejogabilidade infinita. \n\nJogue do seu jeito: sozinho, no modo cooperativo de tela dividida para 2 jogadores (somente console) ou no modo cooperativo online para até 4 jogadores com suporte total para jogo cruzado e progressão cruzada.* Não importa se você está descobrindo Halo pela primeira vez ou retornando depois de 25 anos, Halo: Campaign Evolved oferece uma aventura que é ao mesmo tempo atemporal e totalmente nova.\n\nDESCUBRA O RINGWORLD: \nApós um pouso forçado em um misterioso mundo circular conhecido como Halo, o Master Chief recebe a tarefa de ajudar os humanos restantes a sobreviverem contra as forças esmagadoras do Covenant. Com a ajuda de Cortana, sua companheira de IA, ele explora os segredos de Halo e luta para salvar a galáxia da completa aniquilação.\n\nA CAMPANHA COMPLETA, RECONSTRUÍDA: \nLute nas missões originais, refeitas com visuais de alta definição, cinemática atualizada e design de níveis refinado.\n\nCINEMÁTICA E ÁUDIO REFORMULADOS: \nVisuais e animações totalmente novos, além de uma trilha sonora remasterizada e design de som totalmente reconstruído para uma imersão mais profunda.\n\nCOMBATE E ARMAS EXPANDIDOS: \nO combate clássico de Halo está mais ágil do que nunca, agora com 9 armas icônicas adicionais de toda a série para incrementar seu arsenal.\n\nTRÊS NOVAS MISSÕES: \nJogue como Master Chief ao lado do Sgt. Johnson em Operation: Meteorite, uma operação de combate independente com novos ambientes, gameplay e inimigos.\n\nJOGUE SOZINHO OU COM AMIGOS: \nModo cooperativo para 2 jogadores em tela dividida (apenas no console) ou cooperativo online para 4 jogadores, com suporte a jogo cruzado e progressão cruzada entre console e PC.\n\nDIRIJA, SEQUESTRE, CAUSE ESTRAGOS: \nOs veículos icônicos de Halo estão de volta, oferecendo ainda mais formas de provocar caos memorável. Pela primeira vez em Halo: CE, você pode sequestrar veículos inimigos e pilotar um tanque Wraith totalmente funcional.\n\nREJOGABILIDADE INFINITA: \nRemixe cada missão com os modificadores opcionais “Skull”, que adicionam variedade e desafio com armas, inimigos e ambientes aleatórios.","skuId":"0010","skuImages":{},"skuTitle":"Halo: Campaign Evolved – Standard Edition","isUbisoftConsoleCrossEntitlement":false}},"9N683TDT5M7R":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"productId":"9N683TDT5M7R","skuDescription":"Vivencie o início da lenda\n\nHalo: Campaign Evolved é um remake fiel, porém modernizado, da campanha Halo: Combat Evolved. Vivencie a história original reconstruída com visuais de alta definição, cinemáticas atualizadas e controles refinados, além de três novas missões prequela com o Master Chief e o Sgt. Johnson. Um arsenal ampliado de armas, veículos, inimigos e “Skulls” que modificam a jogabilidade (modificadores opcionais que deixam o combate mais divertido e desafiador) e adicionam novas táticas e infinita rejogabilidade. \n\nJogue do seu jeito: sozinho, em modo co-op com tela dividida para 2 jogadores (somente console) ou em modo cop-op online para até 4 jogadores com suporte completo para crossplay e progressão cruzada.  Não importa se você está descobrindo Halo pela primeira vez ou voltando ao combate depois de 25 anos, Halo: Campaign Evolved oferece uma aventura lendária, atemporal e totalmente renovada.\n\nDescubra o Ringworld\n\nApós um pouso forçado em um misterioso mundo circular conhecido como Halo, o Master Chief recebe a tarefa de ajudar os humanos restantes a sobreviverem contra as forças esmagadoras do Covenant. Com a ajuda de Cortana, sua companheira de IA, ele explora os segredos de Halo e luta para salvar a galáxia da completa aniquilação.\n\nPrincipais recursos\n\nA campanha completa, reconstruída\nLute nas missões originais, recentemente reconstruídas com design avançado, cinemática atualizada e sinalização aprimorada, refinadas para manter o ritmo sem perder o encanto, a tensão ou o heroísmo do original.\n\nCinemática e áudio avançados\nVistas icônicas, arquitetura alienígena e encantos da ficção científica renascem com novos visuais, cinemática e animações. A trilha sonora foi remasterizada, o design de som foi atualizado para proporcionar maior imersão e novas performances de voz foram gravadas com o elenco principal.\n\nCombate e armas expandidos\nO combate clássico de Halo parece instantaneamente familiar, mas mais afiado do que nunca. Corra, mire e ataque com excelente precisão. Pela primeira vez em Halo: CE, você pode empunhar 9 armas icônicas adicionais de toda a série, incluindo a Espada de Energia, o Rifle de Batalha e o Rifle de Agulha, oferecendo mais maneiras de abordar cada luta.\n\nTrês novas missões prequela\nJunte-se ao Master Chief e ao Sgt. Johnson em um novo arco ambientado antes dos eventos de Halo: Combat Evolved, com novos ambientes, jogabilidade, personagens e inimigos.\n\nJogue sozinho ou com amigos\nJogue a campanha completa no modo co-op em tela dividida para 2 jogadores (somente console) ou no modo co-op online para 4 jogadores, completo com crossplay e progressão compartilhada entre console e PC.\n\nDirija, sequestre, cause estragos\nNão importa se você está percorrendo o mapa em um Warthog ou capotando-o com amigos, os veículos sempre estiveram no coração da diversão em Halo. Agora, eles vão ainda mais longe: pela primeira vez em Halo: CE, você pode sequestrar veículos inimigos e pilotar um Wraith totalmente dirigível, criando um caos inesquecível.\n\nReinvente sua campanha para uma jogabilidade infinita\nUse o recurso de remix de campanha para retornar a qualquer missão e reinventar a experiência com os \"\"Skulls\"\", os modificadores de jogabilidade mais ousados já vistos em uma campanha de Halo. Esses modificadores opcionais adicionam desafio e variedade com armas, inimigos e ambientes aleatórios.","skuId":"0010","skuImages":{},"skuTitle":"Halo: Campaign Evolved","isUbisoftConsoleCrossEntitlement":false}},"9PP5G1F0C2B6":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"9XFR1LB3NKTZ","preferredAvailabilityId":"9XFR1LB3NKTZ","productId":"9PP5G1F0C2B6","skuDescription":"Multijogador gratuito: \n\nVivencie o célebre multijogador do Halo reimaginado e gratuito! Com mais de 70 mapas em organização de partida, bilhões de configurações de personalização e incontáveis criações da comunidade da Forja para vivenciar, Halo Infinite é a oferta de multijogador mais expansiva da franquia até o momento. \n\nAproveite uma variedade sem precedentes de experiência de jogo, de modos de jogo intenso e de ritmo rápido para causar caos nos Jogos Personalizados ou até coordenação em cooperação no modo de sobrevivência com base em ondas Tiroteio: Rei da Colina. Com algo para atender às preferências e ao estilo de jogo de cada jogador, é hora de se vestir e montar sua Esquadra! \n\n \n\nBeta da Forja: \n\nA lendária ferramenta de criação de conteúdo de Halo está mais poderosa do que nunca com recursos avançados como um novo motor de script, editor de modos, dimensionamento de objetos, ferramentas de iluminação e áudio, além de melhorias marcadas em fidelidade e limites de orçamento do objeto. \n\nA Forja também inclui o poderoso Kit de Ferramentas de IA, permitindo que os jogadores adicionem uma IA de campanha às suas criações. Seja remasterizando experiências icônicas de versões anteriores de Halo ou criando algo totalmente único, as possibilidades para mapas personalizados e modos de jogo são infinitas. \n\n \n\nJogo de geração cruzada e entre plataformas: \n\nHalo Infinite fornece uma experiência incrível no Xbox One e da nova família de consoles, além de PC com gráficos 4K impressionantes e jogo multiplataforma impressionante. E, no Xbox Series X, assim como PCs com suporte, aproveite recursos melhorados como até 120FPS e tempos de carregamento muito reduzidos, criando um jogo contínuo que traz a próxima geração de jogos. * \n\n*Até 120FPS e 4K Ultra HD disponível no console Xbox Series X e PCs compatíveis apenas em mapas e modos com surpote; TV ou monitor compatíveis requeridos.  ","skuId":"0010","skuImages":{},"skuTitle":"Halo Infinite","isUbisoftConsoleCrossEntitlement":false}},"BTD24M1QCD56":{"0001":{"isGamesWithGoldSku":false,"isPreorder":false,"productId":"BTD24M1QCD56","skuDescription":"Baixe Agora!","skuId":"0001","skuImages":{},"skuTitle":"Halo: Reach","isUbisoftConsoleCrossEntitlement":false}},"9MT8PTGVHX2P":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"9XRFD0HBHKSV","preferredAvailabilityId":"9XRFD0HBHKSV","productId":"9MT8PTGVHX2P","skuDescription":"MEMBROS DO XBOX GAME PASS – Baixem e joguem selecionando \"Halo: The Master Chief Collection\", \"Halo 3: ODST\" e \"Halo: Reach\" abaixo de \"Neste Pacote\". \r\n\r\nAprimorada, atualizada e melhor do que nunca, agora a história completa do Master Chief está otimizada para o Xbox Series X|S. Aproveite recursos de próxima geração como carregamento rápido, cross-play multigeração, ajuste do campo de visão, experiência com tela dividida aprimorada e resolução de até 4K a 120FPS.*\r\nHomenageando o herói lendário e sua jornada épica, a coletânea Halo: The Master Chief Collection reúne a história completa do Master Chief. Halo: Combat Evolved Anniversary, Halo 2: Anniversary, Halo 3, Halo 4, e agora Halo: Reach e Halo 3 ODST, foram incluídos e integrados em uma experiência única. \r\n\r\nO Pacote Digital da Master Chief Collection é a maior experiência de Halo já lançada, com um total de 67 missões de campanha, mais de 120 mapas multijogador (incluindo os mapas originais de Halo Combat Evolved), mapas Spartan Ops e inúmeras maneiras de jogar os conteúdos criados pela comunidade com a Forge. Agora atualizada com aprimoramentos para o Xbox Series X, esta é a coletânea dos sonhos de todo fã de Halo!* \r\n\r\n*Aviso Geral de Isenção de Responsabilidade – Melhorias no modo com tela dividida e resolução de 4K a 120FPS só estão disponíveis no Xbox Series X. No Xbox Series S está disponível a resolução de 1080p a 120FPS. Alguns recursos de jogo, incluindo os vídeos secretos de terminais, requerem conexão à Internet de banda larga; sujeita às taxas do provedor de acesso. Recursos do multijogador online requerem uma assinatura Game Pass Core (vendida separadamente). ","skuId":"0010","skuImages":{},"skuTitle":"Halo: The Master Chief Collection","isUbisoftConsoleCrossEntitlement":false}},"BRRC2BP0G9P0":{"0001":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"9XL5PV8LJXVF","preferredAvailabilityId":"9XL5PV8LJXVF","productId":"BRRC2BP0G9P0","skuDescription":"Halo 5: Guardians oferece uma experiência multijogador épica com vários modos, ferramentas completas para criação de níveis e um novo capítulo da saga do Master Chief. Agora, com Xbox One X, os jogadores podem aproveitar visuais aprimorados e mais detalhados, com resolução de até 4K  e fidelidade gráfica melhorada, deixando o jogo mais bonito do que nunca, mantendo consistência com 60 FPS para jogar da forma mais fluida possível.\r\n\r\nCAMPANHA ÉPICA\r\nA saga do Master Chief continua em uma experiência individual ou cooperativa para 4 jogadores em três mundos. Uma força misteriosa e implacável ameaça a galáxia. Os Spartans da Esquadra Osiris e a Equipe Azul devem embarcar em uma jornada que vai mudar o rumo da história e o futuro da humanidade.\r\n\r\nMULTIJOGADOR ZONA DE GUERRA\r\nJogue com amigos ou enfrente rivais em três grandes modos multijogador inéditos, na franquia Halo: Zona de Guerra, Ataque Zona de Guerra e Tiroteio Zona de Guerra. \r\n\r\n- ZONA DE GUERRA é um modo multijogador de grande escala que suporta batalhas de 24 jogadores, com inimigos controlados por IA aparecendo constantemente para dar uma agitada na experiência. \r\n\r\n- No ATAQUE ZONA DE GUERRA, temos um \"ataque e defesa\" de 24 jogadores em que a equipe atacante tem que invadir pontos estratégicos, enquanto a equipe oposta trabalha para impedir a ofensiva. \r\n\r\n- TIROTEIO ZONA DE GUERRA é uma nova e ambiciosa experiência multijogador, que entrega a maior experiência cooperativa já vista na história da franquia Halo. Até oito jogadores trabalham juntos para concluir cinco rodadas de objetivos dinâmicos, com tempo determinado, que ficam cada vez mais difíceis, para saírem vitoriosos.\r\n\r\nARENA MULTIJOGADOR\r\nA Arena multijogador do Halo 5 mantém o legado consolidado de puro combate competitivo 4v4 baseado em habilidade. Vários modos de Arena oferecem incontáveis formas de jogar e competir, dos clássicos modos Assassino e Capture a Bandeira a modos sociais populares, como Infecção, Bola Veloz e o novo Super Fiesta.\r\n\r\nFORGE\r\nPor anos, o modo Forge permitiu que os fãs de Halo criassem novos mapas e modos de jogo que mudam a experiência e a forma de jogar Halo. Baixe novos níveis criados pela comunidade de Forge, tanto no Windows (usando o “Halo 5: Forge” para Windows 10) quando no Xbox One. Personalize mapas existentes ou crie o seu próprio do zero. Procure, encontre e jogue uma série interminável de jogos personalizados criados e hospedados pela comunidade.\r\n\r\nSISTEMA REQ\r\nNovo no Halo 5: Guardians é o Sistema de Requisição (Sistema REQ), que premia os jogadores por seu tempo gasto nos modos multijogador de Halo 5. Os jogadores receberão Pontos REQ após cada partida na Arena ou na Zona de Guerra, que podem então ser usados para comprar Pacotes REQ contendo uma variedade de itens REQ – armas, armaduras, veículos, posturas, assassinatos e mais – para serem desbloqueados!\r\n\r\nADVERTÊNCIA DE FOTOSSENSIBILIDADE: Uma pequena parcela da população pode apresentar ataques epiléticos ou convulsões quando exposta a certas imagens, incluindo os flashes das luzes ou padrões que aparecem nos videogames. Visite Xbox.com para mais informações","skuId":"0001","skuImages":{},"skuTitle":"Halo 5: Guardians","isUbisoftConsoleCrossEntitlement":false}},"BSXZVK24CMR3":{"0001":{"isGamesWithGoldSku":false,"isPreorder":false,"productId":"BSXZVK24CMR3","skuDescription":"Este jogo suporta Português. Para transferires o manual deste jogo, procura o jogo em http:\u002F\u002Fmarketplace.xbox.com e selecciona \"Ver Manual do Jogo\". A saga épica continua com o Halo 3, o ansiosamente esperado terceiro capítulo da famosíssima franquia Halo criada pela Bungie e aclamada pela crítica. Master Chief volta para terminar a luta, levando a um clímax dramático e emocionante, o conflito épico entre o Covenant, o Flood e toda a raça humana. Este artigo não permite reembolsos. Para obter mais informações, consulte www.xbox.com\u002Flive\u002Faccounts.","skuId":"0001","skuImages":{},"skuTitle":"Halo 3","isUbisoftConsoleCrossEntitlement":false}},"BZ270K7LH1TZ":{"0001":{"isGamesWithGoldSku":false,"isPreorder":false,"productId":"BZ270K7LH1TZ","skuDescription":"Este jogo suporta Inglês e Espanhol. Para transferires o manual deste jogo, procura o jogo em http:\u002F\u002Fmarketplace.xbox.com e selecciona \"Ver Manual do Jogo\". Halo Wars is a strategy game based on the legendary Halo® universe.  Command entire armies of Spartans, Warthogs and more into combat as you join the crew of the “Spirit of Fire” to battle the alien Covenant.  Designed from the ground up for the Xbox 360, Halo Wars let you effortlessly command powerful armies in epic battles. Este artigo não permite reembolsos. Para obter mais informações, consulte www.xbox.com\u002Flive\u002Faccounts.","skuId":"0001","skuImages":{},"skuTitle":"Halo Wars","isUbisoftConsoleCrossEntitlement":false}},"9PNGDJM7FKZH":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"9T7D06RH4X4R","preferredAvailabilityId":"9T7D06RH4X4R","productId":"9PNGDJM7FKZH","skuDescription":"PREMIUM EDITION INCLUI:\n•\tJogo Halo: Campaign Evolved\n•\tAlpha Halo Armory Pack, com 5 skins de armadura Master Chief e 6 skins de armas\n•\tLivro de arte digital Art of Halo: Campaign Evolved\n•\tConto digital Halo: Hungry Buzzards\n•\tManual do jogo digital\n\nVIVA ONDE A LENDA COMEÇA\nHalo: Campaign Evolved é uma recriação fiel e modernizada da campanha de Halo: Combat Evolved. Viva a história original reconstruída com visuais em alta definição, cinemática atualizada e controles aprimorados, além de uma nova aventura de três missões com o Master Chief e o Sgt. Johnson. Um arsenal ampliado de armas, veículos, inimigos e “Skulls”, modificadores opcionais que transformam o combate de maneiras divertidas e desafiadoras, agregando novas táticas e rejogabilidade infinita. \n\nJogue do seu jeito: sozinho, no modo cooperativo de tela dividida para 2 jogadores (somente console) ou no modo cooperativo online para até 4 jogadores com suporte total para jogo cruzado e progressão cruzada.* Não importa se você está descobrindo Halo pela primeira vez ou retornando depois de 25 anos, Halo: Campaign Evolved oferece uma aventura que é ao mesmo tempo atemporal e totalmente nova.\n\nDESCUBRA O RINGWORLD: \nApós um pouso forçado em um misterioso mundo circular conhecido como Halo, o Master Chief recebe a tarefa de ajudar os humanos restantes a sobreviverem contra as forças esmagadoras do Covenant. Com a ajuda de Cortana, sua companheira de IA, ele explora os segredos de Halo e luta para salvar a galáxia da completa aniquilação.","skuId":"0010","skuImages":{},"skuTitle":"Halo: Campaign Evolved - Premium Edition","isUbisoftConsoleCrossEntitlement":false}},"C15T02R2S8BK":{"0001":{"isGamesWithGoldSku":false,"isPreorder":false,"productId":"C15T02R2S8BK","skuDescription":"Halo: Spartan Assault é um jogo de tiro com ritmo rápido ambientado entre os eventos de “Halo 3” e “Halo 4”. Avance na sua carreira de Spartan em mais de 30 emocionantes missões da Campanha, usando muitas das armas, habilidades de armaduras e veículos favoritos de Halo.Colabore no Xbox Live e lute ao lado de um amigo contra as terríveis hordas Flood no novo modo multijogador co-op online.Ganhe conquistas, complete Assault Ops semanais e dispute pela melhor pontuação nos placares de líderes.","skuId":"0001","skuImages":{},"skuTitle":"Halo: Spartan Assault","isUbisoftConsoleCrossEntitlement":false}},"C26XNFLHTSGH":{"0001":{"isGamesWithGoldSku":false,"isPreorder":false,"productId":"C26XNFLHTSGH","skuDescription":"A versão do Jogos sob Demanda suporta o Português do Brasil.O Master Chief regressa para combater um mal antigo empenhado na vingança e na aniquilação. Desterrado num mundo misterioso, enfrentando novos inimigos e tecnologias letais, o universo nunca mais será o mesmo. Alista-te a bordo da Infinity para sentires o modo multijogador original do Halo e o modo Spartan ops - com missões co-op inovadoras, por episódios e baseadas em ficção.","skuId":"0001","skuImages":{},"skuTitle":"Halo 4","isUbisoftConsoleCrossEntitlement":false}},"BNQ1T5HWZWWC":{"0001":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"B4J2LSL9Z08G","preferredAvailabilityId":"B4J2LSL9Z08G","productId":"BNQ1T5HWZWWC","skuDescription":"Real-time strategy makes an explosive return to the Halo universe in Halo Wars 2. Lead Spartans, Warthogs and other classic Halo fighting forces into war across a wide variety of single player and multiplayer modes.\r\n\r\nThe Halo Wars 2 demo features the opening mission from the thrilling campaign and an exciting new game mode, Blitz Firefight. In the campaign, players will strategically command overwhelming firepower in large-scale battles against a terrifying threat facing the UNSC and all of humanity. Blitz Firefight is a fast-paced mode where players use decks of cards to summon vehicles and troops to fight against waves of AI-controlled enemies. \r\n\r\nTry before you buy with the Halo Wars 2 demo.","skuId":"0001","skuImages":{},"skuTitle":"Halo Wars 2 Demo","isUbisoftConsoleCrossEntitlement":false}},"9P6VZCRGXFMX":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"9Q33VFBV221S","preferredAvailabilityId":"9Q33VFBV221S","productId":"9P6VZCRGXFMX","skuDescription":"Halo 3: ODST chega ao PC como o próximo título disponível da Halo: The Master Chief Collection. Agora otimizado para PC, vivencie os eventos que precedem Halo 3 pelos olhos da Tropa de Choque de Desembarque Orbital (ODST), que retorna a um terreno familiar e tenta descobrir as motivações por trás da invasão de Nova Mombasa pelo Covenant. Isolado e vulnerável, use furtividade e precisão para sobreviver aos perigos da ocupação do Covenant em uma nova e emocionante abordagem de combate no universo Halo.\r\n\r\nCaracterísticas do Jogo: \r\n• Configurações\u002FOtimizações para PC: Halo 3: ODST está mais bonito do que nunca com as otimizações para PC, podendo rodar em até 4k UHD a 60+ FPS.* Outras configurações nativas do PC incluem suporte personalizado para mouse e teclado, resoluções ultrawide, personalização do campo de visão e muito mais. \r\n• Campanha: jogue por um novo capítulo da saga Halo e vivencie 11 missões inesquecíveis.\r\n• Tiroteio: pela primeira vez, o Tiroteio ODST vai se juntar à Master Chief Collection! Agora rodando em servidores dedicados, o Tiroteio suporta jogos cooperativos de até 4 jogadores e conta com organização de partidas online e novos modos de jogo personalizados. Enfrente ondas de invasores do Covenant para libertar a cidade de Nova Mombasa em 10 mapas clássicos. \r\n• Cinema: utilize o Cinema para capturar e compartilhar seus momentos favoritos de Halo com a comunidade. \r\n\r\n*Veja os requisitos de sistema para saber as especificações mínimas de hardware para alcançar o desempenho ideal.","skuId":"0010","skuImages":{},"skuTitle":"Halo 3: ODST","isUbisoftConsoleCrossEntitlement":false}},"BPRPQSKXTD1L":{"0001":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"9VWWTVB4KFQG","preferredAvailabilityId":"9VWWTVB4KFQG","productId":"BPRPQSKXTD1L","skuDescription":"Halo Wars: Definitive Edition é uma versão melhorada de Halo Wars, clássico de estratégia em tempo real. O jogo foi atualizado para Xbox One e Windows 10. \r\n\r\nMostrando o início da guerra icônica entre o Covenant e o UNSC, que ganhou fama nos jogos FPS da franquia, Halo Wars: Definitive Edition oferece uma visão exclusiva da guerra, trazendo novos heróis ao campo de batalha. Controle e conduza grandes exércitos em uma guerra cheia de ação. \r\n \r\nHalo Wars: Definitive Edition inclui gráficos melhorados, novas conquistas e todos os DLCs do jogo original. Reviva a campanha épica ou participe de batalhas multijogador online comandando exércitos de forças poderosas da franquia.","skuId":"0001","skuImages":{},"skuTitle":"Halo Wars: Definitive Edition","isUbisoftConsoleCrossEntitlement":false}},"9P5739G419LD":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"9P5B9ZZT6FZM","preferredAvailabilityId":"9P5B9ZZT6FZM","productId":"9P5739G419LD","skuDescription":"Halo 2: Anniversary chega ao PC como o próximo título da Halo: The Master Chief Collection. Agora otimizado para PC, jogue esta edição impecavelmente remasterizada do Halo 2 original. Seguindo a destruição de Halo, a raça humana descobre que a vitória dura pouco. Ansiando por vingança, os Covenants lançam um ataque surpresa contra a Terra, mas acabam percebendo que não estão preparados para derrotar a frota da UNSC, sendo então forçados a fugir para o subespaço. Em meio à perseguição aos seus inimigos extremistas, Master Chief descobre outro anel Halo, revelando segredos há muito tempo ocultos, incluindo um aliado improvável que vai mudar para sempre os rumos do conflito entre humanos e Covenants.  \r\n\r\nNovos Recursos:  \r\n• Configurações\u002FOtimizações para PC: Halo 2: Anniversary agora está otimizado para PC e conta com visuais incríveis em resoluções de até 4k UHD e 60+ FPS.* Outras configurações nativas do PC incluem suporte personalizável a mouse e teclado, resoluções ultrawide, personalização do campo de visão e mais.  \r\n• Campanha: Jogue o próximo capítulo da saga Halo e desbrave 15 missões inesquecíveis. Jogue tanto como o Spartan-117, o Master Chief, quanto, pela primeira vez, como o Elite Covenant, conhecido como Árbitro, e vivencie o conflito entre humanos e Covenants de uma maneira completamente nova.  \r\n• Edição\u002FAtualização Anniversary: Alterne entre os gráficos remasterizados da edição Anniversary e os gráficos da campanha original de Halo 2. Na edição Anniversary, veja as cenas do Halo 2 original remasterizadas de forma espetacular pelo Blur Studio.  \r\n• Multijogador: Continue sua aventura em Halo com 7 mapas multijogador remasterizados de Halo 2: Anniversary e 25 mapas multijogador do Halo 2 original, contando com um sistema de progressão totalmente atualizado.  \r\n\r\n  \r\n\r\n* Veja os requisitos de sistema para saber as especificações mínimas de hardware para alcançar o desempenho ideal.","skuId":"0010","skuImages":{},"skuTitle":"Halo 2: Anniversary","isUbisoftConsoleCrossEntitlement":false}},"9NBLGGH5WMKM":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"productId":"9NBLGGH5WMKM","skuDescription":"É a experiência de Halo que você sempre sonhou - controlar exércitos inteiros de Fuzileiros, Warthogs, tanques Scorpion e Spartans em batalha do ponto de vista do Comandante. Halo Wars 2 é um jogo de estratégia em tempo real com gráficos em Ultra HD 4K com HDR no Xbox One X e Windows 10. Halo Wars 2 também suporta Xbox Play Anywhere: compre só uma vez e jogue no Xbox e Windows 10.\r\n\r\nUma história totalmente nova e cheia de ação – os heróis de Halo Wars despertam e encontram a galáxia em grande perigo. Depois dos eventos de Halo 5, viva uma nova história com missões cheias de ação em um lugar lendário conhecido como Ark. Os jogadores comandam um enorme poder de fogo, enfrentando uma ameaça terrível contra o UNSC e toda a humanidade em grandes batalhas. \r\n\r\nMonte seu Exército em Halo – construa suas bases, prepare seus veículos e reúna tropas. Lidere-o em imensas batalhas com partidas de campanha contra IA, ou colaborando e enfrentando seus amigos em partidas 3v3 no Xbox Live. Aprenda novas estratégias com diferentes líderes nos modos de jogo Blitz e Multijogador. \r\n\r\nCom Halo Wars 2, você pode explorar e batalhar no universo de Halo de maneira inédita. \r\n\r\nOs recursos multijogador on-line requerem a Assinatura Game Pass Core (vendida separadamente). \r\n\r\nADVERTÊNCIA DE FOTOSSENSIBILIDADE: Uma pequena parcela da população pode apresentar ataques epiléticos ou convulsões quando exposta a certas imagens, incluindo os flashes das luzes ou padrões que aparecem nos videogames. Acesse Xbox.com para mais informações.","skuId":"0010","skuImages":{},"skuTitle":"Halo Wars 2","isUbisoftConsoleCrossEntitlement":false}},"9PJW8QZRVKL4":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"productId":"9PJW8QZRVKL4","skuDescription":"Mergulhe no mundo de Halo: Campaign Evolved com o novo conto Halo: Hungry Buzzards, o livro de arte digital oficial e um tributo modernizado ao manual original do jogo de 2001.\n\nConto Halo: Hungry Buzzards\nNo coração de uma instalação de testes da UNSC em Reach, o Master Chief demonstra ao Coronel James Ackerson que, não importa a competição, um Spartan é capaz de realizar feitos que nenhum outro recurso militar consegue. É uma realidade que será posta à prova quando uma equipe for montada para embarcar em uma nave de pesquisa Covenant encontrada orbitando o mundo recentemente envidraçado de Promise. Escrito pelo premiado autor Troy Denning, Halo: Hungry Buzzards leva diretamente aos eventos de Operation: METEORITE, a nova aventura de três missões incluída em Halo: Campaign Evolved. \n\nLivro de arte digital Art of Halo: Campaign Evolved\nApresentando conceitos, designs de personagens e ambientes de momentos-chave em Halo: Campaign Evolved, esta bela coleção de arte mostra como a visão original de Combat Evolved de 2001 foi cuidadosamente reinventada com técnicas e tecnologias modernas. Da escala ampla do mundo dos anéis à armadura icônica do Master Chief, o livro de arte digital The Art of Halo: Campaign Evolved oferece uma visão única dos visuais que ajudaram a dar vida à campanha do jogo para uma nova geração.\n\nManual do jogo digital\nUma homenagem moderna cuidadosamente elaborada ao manual original de Halo: Combat Evolved, esta edição digital combina a apresentação clássica com detalhes contemporâneos. Apresentando informações atualizadas de gameplay, controles e história de fundo, o manual do jogo digital Halo: Campaign Evolved é um companheiro nostálgico para fãs de longa data e um guia introdutório útil para os novatos que entram no Alpha Halo pela primeira vez.","skuId":"0010","skuImages":{},"skuTitle":"Coleção Digital de História e Arte - Halo: Campaign Evolved","isUbisoftConsoleCrossEntitlement":false}},"9MV2TRWWLSX4":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"9TRLHPNJ574Q","preferredAvailabilityId":"9TRLHPNJ574Q","productId":"9MV2TRWWLSX4","skuDescription":"*Requer o jogo Halo: Campaign Evolved ou assinatura do Game Pass (Ultimate ou PC), todos vendidos separadamente. Não compre a Atualização para a Premium Edition se você já tiver Halo: Campaign Evolved Premium Edition.\n\nA ATUALIZAÇÃO DA PREMIUM EDITION INCLUI:\n•\tAlpha Halo Armory Pack, com 5 skins de armadura Master Chief e 6 skins de armas\n•\tLivro de arte digital Art of Halo: Campaign Evolved\n•\tConto de Halo: Hungry Buzzards\n•\tManual do jogo digital\n\nVIVA ONDE A LENDA COMEÇA\nHalo: Campaign Evolved é uma recriação fiel e modernizada da campanha de Halo: Combat Evolved. Viva a história original reconstruída com visuais em alta definição, cinemática atualizada e controles aprimorados, além de uma nova aventura de três missões com o Master Chief e o Sgt. Johnson. Um arsenal ampliado de armas, veículos, inimigos e “Skulls”, modificadores opcionais que transformam o combate de maneiras divertidas e desafiadoras, agregando novas táticas e rejogabilidade infinita. \n\nJogue do seu jeito: sozinho, no modo cooperativo de tela dividida para 2 jogadores (somente console) ou no modo cooperativo online para até 4 jogadores com suporte total para jogo cruzado e progressão cruzada.* Não importa se você está descobrindo Halo pela primeira vez ou retornando depois de 25 anos, Halo: Campaign Evolved oferece uma aventura que é ao mesmo tempo atemporal e totalmente nova.","skuId":"0010","skuImages":{},"skuTitle":"Halo: Campaign Evolved - Atualização da Premium Edition","isUbisoftConsoleCrossEntitlement":false}},"C1XFHQSGWGD1":{"0001":{"isGamesWithGoldSku":false,"isPreorder":false,"productId":"C1XFHQSGWGD1","skuDescription":"Created in celebration of the 10th anniversary of one of the most beloved franchises in gaming history, Halo: Combat Evolved Anniversary is a spectacularly remastered version of the original Halo campaign. Bundled with seven of the most popular multiplayer maps in Halo history ready for Xbox LIVE, Halo: Anniversary will include a bounty of new features including cooperative play over Xbox LIVE, Achievements, new challenges, and new fiction to uncover.","skuId":"0001","skuImages":{},"skuTitle":"Halo: Combat Evolved Anniversary","isUbisoftConsoleCrossEntitlement":false}},"BV0K9LMLQ9W5":{"0001":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"9X8FH4117GZV","preferredAvailabilityId":"9X8FH4117GZV","productId":"BV0K9LMLQ9W5","skuDescription":"Halo: Spartan Assault é um jogo de tiro com ritmo rápido e evolução detalhada ambientado entre os eventos de “Halo 3” e “Halo 4”. Avance na sua carreira de Spartan participando de mais de 30 missões de Campanha emocionantes e usando muitas das armas, habilidades de armaduras e veículos favoritos de Halo.\r\n\r\nForme equipes no Xbox Live e lute ao lado de um amigo contra as hordas da terrível Flood no novíssimo modo multijogador cooperativo on-line.\r\n\r\nAVISO SOBRE ATAQUES DE EPILEPSIA FOTOSSENSÍVEL: Uma pequena parcela da população pode apresentar ataques epiléticos ou convulses quando exposta a certas imagens, incluindo os flashs das luzes ou padrões que aparecem nos video games. Visite Xbox.com para mais informações","skuId":"0001","skuImages":{},"skuTitle":"Halo: Spartan Assault","isUbisoftConsoleCrossEntitlement":false}},"BPK4ZKFCFL5G":{"0001":{"isGamesWithGoldSku":false,"isPreorder":false,"productId":"BPK4ZKFCFL5G","skuDescription":"MEMBROS DO XBOX GAME PASS – Baixem e joguem selecionando \"Halo: The Master Chief Collection\", \"Halo 3: ODST\" e \"Halo: Reach\" em \"Neste Pacote\". \r\n\r\nA Temporada 6 já está disponível com a atualização GRATUITA mais recente para Halo: The Master Chief Collection! Divirta-se com novos conteúdos:\r\n•\tNovas armaduras de Halo 3 inspiradas no jogo de fliperama Halo: Fireteam Raven. Os jogadores podem desbloquear quatro conjuntos de armaduras e capas para veículos e armas com a temática dessa equipe de ataque lendária.\r\n•\tNovas opções de personalização: crie um Spartan especialmente para você, com novos efeitos visuais, visores animados, acessórios traseiros para Halo 3 e mais de 100 prêmios da Temporada 6.\r\n•\tTroca de Pontos da Temporada: troque pontos da temporada por itens de personalização visual exclusivos e prêmios de desafios de temporadas anteriores.\r\n\r\nAprimorada, atualizada e melhor do que nunca, agora a história completa do Master Chief está otimizada para o Xbox Series X|S. Aproveite recursos de próxima geração como carregamento rápido, cross-play multigeração, ajuste do campo de visão, experiência com tela dividida aprimorada e resolução de até 4K a 120 FPS.*\r\nHomenageando o herói icônico e sua jornada épica, a coletânea Halo: The Master Chief Collection reúne a história completa do Master Chief. Halo: Combat Evolved Anniversary, Halo 2: Anniversary, Halo 3, Halo 4, e agora Halo: Reach e Halo 3: ODST foram incluídos e integrados em uma experiência única. \r\n\r\nO Pacote Digital da Master Chief Collection é a maior experiência de Halo já lançada, com um total de 67 missões de campanha, mais de 120 mapas multijogador (incluindo os mapas originais de Halo Combat Evolved), mapas de Spartan Ops e inúmeras maneiras de jogar os conteúdos criados pela comunidade com a Forge. Agora atualizada com aprimoramentos para o Xbox Series X, essa é a coletânea dos sonhos de todo fã de Halo!* \r\n\r\n*Aviso a Todos – Melhorias no modo com tela dividida e resolução de 4K a 120 FPS só estão disponíveis no Xbox Series X. No Xbox Series S está disponível a resolução de 1080p a 120 FPS. Alguns recursos do jogo, incluindo os vídeos secretos de terminais, requerem uma conexão de internet banda larga, sujeita às taxas cobradas pelo provedor. Os recursos de multijogador online requerem uma assinatura Xbox Live Gold (vendida separadamente). \r\n\r\n\r\nA História Completa de Master Chief – Honrando o herói icônico e sua jornada épica, a história completa de Master Chief está reunida em Halo: The Master Chief Collection. Halo: Combat Evolved Anniversary, Halo 2: Anniversary, Halo 3 e Halo 4 estão todos incluídos e, juntos, totalizam 45 missões de campanha, mais de 100 mapas multijogador (incluindo os mapas originais de Halo Combat Evolved) e mapas de Spartan Ops. Agora atualizada com melhorias do Xbox One X para fornecer suporte a resoluções de até 4K UHD e HDR, essa é a coletânea dos sonhos de todo fã de Halo!*\r\n\r\n\r\n\r\nHalo 2: Anniversary – Em celebração ao aniversário de 10 anos de Halo 2, o favorito dos fãs retorna apresentando uma campanha totalmente remasterizada com o \"Modo Clássico\", que permite a você alternar entre o jogo remasterizado e o original de 2004. Descubra novos elementos da história de Halo 5: Guardians com cenas estendidas, vídeos secretos de terminais, e utilize crânios inéditos para vivenciar a campanha de uma maneira completamente nova. Incluindo os 25 mapas multijogador originais, do jeitinho que os fãs se lembram, além de 6 mapas completamente reformulados. Curta o jogo que definiu o modo multijogador online nos consoles e prepare-se para o próximo capítulo da série Halo.\r\n\r\n\r\n\r\nNova Atualização – As modificações recentes trouxeram novos recursos, como suporte a LAN local offline, download inteligente de conteúdos específicos, carregamento rápido e melhorias do Xbox One X, como o suporte* a resoluções de até 4K UHD e HDR, assim como otimizações e aperfeiçoamentos ao organizar partida. Halo: The Master Chief Collection continua sendo o lugar definitivo para vivenciar a origem da saga de Master Chief.\r\n\r\n\r\n\r\n*Aviso a Todos – É necessário um Xbox One X para obter suporte à resolução 4K UHD e HDR. Alguns recursos do jogo, incluindo os vídeos secretos de terminais, requerem uma conexão de internet banda larga, sujeita às taxas cobradas pelo provedor. Os recursos de multijogador online requerem uma assinatura Xbox Live Gold (vendida separadamente). Halo: Nightfall, a série live action de 5 episódios, só pode ser assistida por streaming. Requer um Xbox One ou Windows 8.1 ou superior e uma conexão de internet banda larga, sujeita às taxas cobradas pelo provedor. Apenas para maiores de 17 anos. As datas, o conteúdo e os recursos de Halo: Nightfall estão sujeitos a mudanças. Acesse www.xbox.com\u002Fhalo","skuId":"0001","skuImages":{},"skuTitle":"Halo: The Master Chief Collection","isUbisoftConsoleCrossEntitlement":false}},"9PLSBTJB87Q7":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"9RJDGBRVN5B8","preferredAvailabilityId":"9RJDGBRVN5B8","productId":"9PLSBTJB87Q7","skuDescription":"It’s the Halo experience you’ve dreamed of – controlling entire armies of Marines, Warthogs, Scorpion tanks, and Spartans on the battlefield from the Commander’s point of view. Halo Wars 2: Complete Edition is the comprehensive version of the real-time strategy hit that includes ALL content for Halo Wars 2. And now you can play in native 4K Ultra HD graphics with HDR on the Xbox One X and Windows 10!\r\n\r\nHalo Wars 2 includes an epic story taking place after the events of Halo 5, told across 12 campaign missions with ultra-realistic cinematics. Once you’ve honed your skills as a commander you can jump into  a variety of multiplayer modes against the computer and play online with Xbox Live. \r\n\r\nThe Season Pass included with the Complete Edition grants you 7 additional leaders to use is Multiplayer and Blitz m ória com missões cheias de ação em um lugar lendário conhecido como Ark. Os jogadores comandam um enorme poder de fogo, enfrentando uma ameaça terrível contra o UNSC e toda a humanidade em grandes batalhas. \r\n\r\nMonte seu Exército em Halo – construa suas bases, prepare seus veículos e reúna tropas. Lidere-o em imensas batalhas com partidas de campanha contra IA, ou colaborando e enfrentando seus amigos em partidas 3v3 no Xbox Live. Aprenda novas estratégias com diferentes líderes nos modos de jogo Blitz e Multijogador. \r\n\r\nCom Halo Wars 2, você pode explorar e batalhar no universo de Halo de maneira inédita. \r\n\r\nOs recursos multijogador on-line requerem a Assinatura Xbox Live Gold (vendida separadamente). \r\n\r\nADVERTÊNCIA DE FOTOSSENSIBILIDADE: Uma pequena parcela da população pode apresentar ataques epiléticos ou convulsões quando exposta a certas imagens, incluindo os flashes das luzes ou padrões que aparecem nos videogames. Acesse Xbox.com para mais informações.","skuId":"0001","skuImages":{},"skuTitle":"Halo Wars 2: Standard Edition","isUbisoftConsoleCrossEntitlement":false}},"9WZDNCRFJBFJ":{"0010":{"isGamesWithGoldSku":false,"isPreorder":false,"optimalAvailabilityId":"B0T99FKD28S5","preferredAvailabilityId":"B0T99FKD28S5","productId":"9WZDNCRFJBFJ","skuDescription":"Halo: Spartan Strike torna você um novo recruta Spartan combatendo forças malignas neste jogo de tiro com visão isométrica e toque. Seja um Spartan e impeça seus inimigos de conquistarem a Terra. Encontre inimigos Promethean e Covenant em 30 missões eletrizantes, através de selvas e cidades, enquanto busca frustrar os planos inimigos de conquistar a Terra. \r\n\r\nÉ hora de desafiar seus inimigos. Ataque Rápido. Seja um Spartan!","skuId":"0010","skuImages":{},"skuTitle":"Halo: Spartan Strike","isUbisoftConsoleCrossEntitlement":false}}},"entitlements":{},"productActions":{},"ratingsAndReviews":{}},"recommendationLists":{},"searchPromotions":{},"streamingHoursSelection":{"type":0},"servi
